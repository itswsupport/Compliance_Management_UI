server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Nothing is proxied here. VITE_API_BASE_URL is an absolute URL to
    # replportal.co.in:8443 and the backend sends `@CrossOrigin(origins="*")`,
    # so the browser calls the API directly.

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml font/woff font/woff2;

    # Vite fingerprints every filename under /assets, so a given URL's content
    # can never change — safe to cache permanently. Covers the bundled Geist
    # woff2 fonts too.
    #
    # One combined Cache-Control rather than `expires 1y` plus add_header: those
    # emit two separate Cache-Control headers on the same response.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
        try_files  $uri =404;
    }

    # index.html must never be cached: it names the hashed bundles, so a stale
    # copy sends clients after asset filenames the next deploy has deleted.
    #
    # The security headers are repeated here on purpose. nginx only inherits
    # add_header from an outer level when the current level defines none, so
    # setting Cache-Control here would otherwise drop the server-level ones.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header Referrer-Policy        "same-origin" always;
    }

    # BrowserRouter is mounted with no basename, so every unmatched path is a
    # client-side route (/comp-admin/pending, /plant-hr/pending, …). Without
    # this fallback, refreshing on any route other than / returns 404.
    # The Jenkins 'Verify SPA Routing' stage asserts this works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header Referrer-Policy        "same-origin" always;

    access_log /var/log/nginx/compliance.access.log;
    error_log  /var/log/nginx/compliance.error.log warn;
}
